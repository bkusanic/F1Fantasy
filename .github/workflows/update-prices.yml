name: Auto-update F1 Fantasy prices

on:
  schedule:
    # Svaki četvrtak u 07:00 i 15:00 UTC (cijene se mijenjaju četvrtkom u tjednu utrke;
    # druga izvedba hvata kasne promjene)
    - cron: "0 7 * * 4"
    - cron: "0 15 * * 4"
  workflow_dispatch: {}   # ručno pokretanje iz Actions taba (za test)

permissions:
  contents: write

jobs:
  sync-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch & update prices
        run: node scripts/update-prices.mjs

      - name: Commit & push if changed
        run: |
          if git diff --quiet lib/constants.ts; then
            echo "Nema promjena — preskačem commit."
          else
            git config user.name "f1-price-bot"
            git config user.email "actions@github.com"
            git add lib/constants.ts
            git commit -m "Auto-sync cijena F1 Fantasy ($(date +%d.%m.%Y))"
            git pull --rebase origin main
            git push
          fi
